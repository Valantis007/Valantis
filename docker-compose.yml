services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /app/data/app.db
      UPLOAD_DIR: /app/data/uploads
    ports:
      # Μόνο τοπικά: η πρόσβαση από το internet γίνεται ΜΟΝΟ μέσω του reverse proxy (Caddy/nginx).
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
